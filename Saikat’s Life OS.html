<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Saikat’s Life OS</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Caveat:wght@700&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #fdf8ec;
            --line: #d6e6f3;
            --ink: #2b2a33;
            --card: #fffdf6;
            --mut: #6b6a75
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #1d1c24;
                --line: #2b3846;
                --ink: #ecebf3;
                --card: #26252f;
                --mut: #a6a5b4
            }
        }

        :root[data-theme="dark"] {
            --bg: #1d1c24;
            --line: #2b3846;
            --ink: #ecebf3;
            --card: #26252f;
            --mut: #a6a5b4
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg) repeating-linear-gradient(transparent 0 31px, var(--line) 31px 32px);
            color: var(--ink);
            font: 16px/1.65 'Inter', 'Hind Siliguri', system-ui, sans-serif
        }

        .w {
            max-width: 900px;
            margin: auto;
            padding: 16px 14px 70px
        }

        h1 {
            font: 700 clamp(32px, 7vw, 48px)/1.1 'Caveat', cursive;
            margin: 6px 0
        }

        h1 span {
            background: linear-gradient(transparent 55%, #ffe066 55%);
            padding: 0 6px
        }

        h2 {
            margin: 0 0 8px;
            font-size: 19px
        }

        nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 10px 0
        }

        button,
        .lk,
        select {
            font: 600 14px 'Inter', 'Hind Siliguri', sans-serif;
            border: 2px solid var(--c, #e8590c);
            background: var(--card);
            color: var(--ink);
            padding: 6px 12px;
            border-radius: 999px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block
        }

        button.on,
        button.f {
            background: var(--c, #e8590c);
            color: #fff
        }

        input,
        textarea {
            font: inherit;
            background: var(--card);
            color: var(--ink);
            border: 2px solid var(--line);
            border-radius: 8px;
            padding: 6px 10px
        }

        .c {
            background: var(--card);
            border-radius: 12px;
            padding: 14px 16px;
            margin: 14px 0;
            box-shadow: 0 3px 0 rgba(0, 0, 0, .12);
            border-top: 5px solid var(--c, #e8590c)
        }

        .add {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 8px 0
        }

        .add input:not([type]),
        .add input[type=text] {
            flex: 1;
            min-width: 150px
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            border-bottom: 1px dashed var(--line)
        }

        .row label {
            flex: 1
        }

        .row.d label {
            text-decoration: line-through;
            opacity: .55
        }

        input[type=checkbox] {
            width: 20px;
            height: 20px
        }

        .bar {
            height: 12px;
            border-radius: 9px;
            background: var(--line);
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--c, #2f9e44)
        }

        .st {
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        .st div {
            flex: 1;
            min-width: 90px;
            text-align: center;
            background: var(--card);
            border-radius: 10px;
            padding: 6px;
            box-shadow: 0 2px 0 rgba(0, 0, 0, .12)
        }

        .st b {
            display: block;
            font: 700 28px 'Caveat', cursive;
            color: #e8590c
        }

        .big {
            font: 700 21px/1.4 'Inter', sans-serif;
            margin: 8px 0
        }

        .hint {
            background: #fff3a8;
            color: #3a3410;
            padding: 8px 12px;
            border-radius: 4px;
            margin: 8px 0;
            font-size: 15px
        }

        small {
            color: var(--mut)
        }

        textarea {
            width: 100%;
            min-height: 70px
        }

        body {
            background: radial-gradient(900px 500px at 0% -10%, rgba(232, 89, 12, .18), transparent), radial-gradient(800px 500px at 100% 0%, rgba(112, 72, 232, .18), transparent), radial-gradient(700px 500px at 50% 100%, rgba(28, 126, 214, .14), transparent), var(--bg);
            background-attachment: fixed
        }

        .w {
            padding-bottom: 130px
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(8px)
            }
        }

        .c {
            border-radius: 20px;
            background: color-mix(in srgb, var(--card) 90%, transparent);
            border: 1px solid color-mix(in srgb, var(--c, #e8590c) 28%, transparent);
            box-shadow: 0 10px 30px -14px color-mix(in srgb, var(--c, #e8590c) 50%, transparent);
            position: relative;
            overflow: hidden;
            animation: rise .3s both
        }

        .c::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--c, #e8590c), color-mix(in srgb, var(--c, #e8590c) 35%, #fff))
        }

        .c h2 {
            font-size: 20px;
            margin-top: 4px
        }

        button {
            transition: .15s
        }

        button:hover {
            transform: translateY(-1px)
        }

        button:active {
            transform: scale(.96)
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: 3px solid color-mix(in srgb, var(--c, #e8590c) 35%, transparent);
            border-color: var(--c, #e8590c)
        }

        .row:hover {
            background: color-mix(in srgb, var(--c, #e8590c) 7%, transparent)
        }

        .st div {
            border-radius: 16px
        }

        .hero {
            background: linear-gradient(135deg, #e8590c, #d6336c 50%, #7048e8);
            color: #fff;
            border-radius: 24px;
            padding: 20px;
            margin: 8px 0 14px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 18px 40px -16px rgba(214, 51, 108, .65);
            animation: rise .3s both
        }

        .hero h2 {
            font: 700 30px/1.1 'Caveat', cursive;
            margin: 0
        }

        .hero p {
            margin: 2px 0;
            opacity: .92
        }

        .hero .fx {
            background: rgba(255, 255, 255, .22);
            padding: 6px 12px;
            border-radius: 12px;
            margin-top: 8px;
            font-size: 14px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin: 10px 0
        }

        .tile {
            background: var(--card);
            border-radius: 18px;
            padding: 14px;
            cursor: pointer;
            border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
            box-shadow: 0 8px 20px -12px var(--c);
            transition: .2s;
            animation: rise .3s both
        }

        .tile:hover {
            transform: translateY(-4px)
        }

        .tile .ti {
            font-size: 30px
        }

        .tile b {
            display: block
        }

        nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 15;
            margin: 0;
            gap: 4px;
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
            background: color-mix(in srgb, var(--card) 88%, transparent);
            backdrop-filter: blur(14px);
            border-top: 1px solid var(--line);
            flex-wrap: nowrap;
            overflow-x: auto
        }

        nav button {
            border: none;
            background: none;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
            padding: 5px 8px;
            font-size: 11px;
            line-height: 1.2;
            white-space: nowrap
        }

        nav button span {
            font-size: 22px
        }

        nav button.on {
            background: linear-gradient(135deg, #e8590c, #d6336c);
            color: #fff
        }

        #fab {
            position: fixed;
            right: 16px;
            bottom: 98px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            padding: 0;
            font-size: 24px;
            border: none;
            background: linear-gradient(135deg, #e8590c, #d6336c);
            color: #fff;
            z-index: 16;
            box-shadow: 0 10px 24px rgba(214, 51, 108, .5)
        }

        #fab.f {
            animation: pulse 1.1s infinite
        }

        @keyframes pulse {
            50% {
                box-shadow: 0 0 0 14px rgba(214, 51, 108, .22)
            }
        }

        #ms {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 100px;
            max-width: 86%;
            background: #2b2a33;
            color: #fff;
            padding: 7px 16px;
            border-radius: 999px;
            z-index: 20;
            font-size: 13px;
            text-align: center
        }

        #ms:empty {
            display: none
        }

        .wallet-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin: 18px 2px 8px
        }

        .wallet-head h2 {
            margin: 0
        }

        .wallet-head p {
            margin: 2px 0;
            color: var(--mut)
        }

        .wallet-tabs {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            padding: 5px 2px 10px;
            scrollbar-width: thin
        }

        .wallet-tabs button {
            flex: 0 0 auto;
            border-color: var(--line);
            white-space: nowrap
        }

        .wallet-tabs button.on {
            border-color: #f08c00;
            background: #f08c00
        }

        .wallet-empty {
            padding: 18px 8px;
            text-align: center;
            color: var(--mut)
        }

        .wallet-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 12px;
            margin: 10px 0
        }

        .payment-card {
            border-radius: 18px;
            overflow: hidden;
            background: linear-gradient(135deg, #7048e8, #d6336c 55%, #f08c00);
            color: #fff;
            min-height: 145px;
            position: relative;
            box-shadow: 0 10px 25px -13px rgba(43, 42, 51, .65)
        }

        .payment-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block
        }

        .payment-card .payment-meta {
            padding: 12px 14px;
            background: linear-gradient(transparent, rgba(15, 15, 24, .72));
            position: absolute;
            inset: auto 0 48px
        }

        .payment-card b,
        .payment-card small {
            color: #fff;
            display: block
        }

        .payment-card .card-actions {
            display: flex;
            gap: 6px;
            padding: 8px
        }

        .wallet-form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
            gap: 8px;
            margin: 8px 0
        }

        .wallet-form-grid input,
        .wallet-form-grid select {
            width: 100%;
            min-width: 0
        }

        .wallet-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin: 8px 0
        }

        .wallet-actions button {
            border-color: var(--line)
        }

        .wallet-preview img {
            display: block;
            width: min(100%, 360px);
            max-height: 200px;
            object-fit: cover;
            border-radius: 14px;
            margin: 8px 0
        }

        .wallet-month {
            width: 160px
        }

        @media(max-width:520px) {
            .wallet-head {
                display: block
            }

            .wallet-month {
                margin-top: 8px
            }

            .wallet-tabs button {
                padding: 7px 11px
            }
        }
    </style>
</head>

<body>
    <div class="w">
        <h1>Saikat’s <span>Life OS</span></h1>
        <div class="add"><select id="lg">
                <option value="en-US">🎤 Voice: English</option>
                <option value="bn-BD">🎤 Voice: বাংলা</option>
            </select><button onclick="th()">🌓 Theme</button></div><small id="ms"></small><button id="fab"
            onclick="fab()" title="Voice add">🎤</button>
        <nav id="nav"></nav>
        <div id="v"></div>
        <p><small>Your data stays on this device/browser. Use Backup on Home to move it. Study-abroad rules, fees and
                deadlines change: always confirm on official university and embassy websites.</small></p>
    </div>
    <script>
        const M = [["tasks", "✅ Tasks", "#e8590c", "What needs doing?"], ["abroad", "🌍 Study Abroad", "#1c7ed6", "Study abroad step…"], ["career", "💼 Career", "#2f9e44", "Job / interview task…"], ["research", "🔬 Research", "#7048e8", "Research topic or link…"], ["goals", "🎯 Goals", "#d6336c", "My goal…"], ["money", "💰 Money", "#f08c00", "Money task…"], ["health", "❤️ Health", "#0ca678", "Health habit…"], ["ideas", "💡 Ideas & Voice notes", "#495057", "Speak or type an idea…"]];
        const PRE = { tasks: ["Plan tomorrow tonight", "Reply to pending messages"], abroad: ["Choose country and course", "Shortlist 8–10 universities (safe / target / dream)", "Set IELTS target score and exam date", "Check passport validity", "Collect transcripts and certificates", "Write first draft of SOP", "Request 2 recommendation letters", "Update academic CV", "Research scholarships and deadlines", "Prepare budget and proof of funds", "Note each university’s application deadline", "Prepare for admission and visa interview"], career: ["Update CV and LinkedIn", "Apply to 5 jobs this week", "Prepare 3 STAR stories", "Do 1 mock interview (voice)", "Polish GitHub and portfolio"], research: ["Compare 3 countries: cost, jobs, visa", "List 10 scholarships with deadlines", "Find 5 professors or labs of interest", "Read each university’s official requirements page"], goals: ["Reach my target IELTS band", "Speak English 20 minutes daily"], money: ["Track monthly expenses", "Save for exam and application fees"], health: ["Walk 30 minutes", "Drink enough water", "Sleep on time"], ideas: [] };
        const QB = { job: ["Tell me about yourself.", "Describe a project you are proud of.", "How do you handle tight deadlines?", "Tell me about a bug you fixed.", "Why should we hire you?", "Where do you see yourself in five years?"], abroad: ["Why do you want to study abroad?", "Why this country and this university?", "Why did you choose this course?", "How will you fund your studies?", "What will you do after graduation?", "Tell me about your academic background."] };
        let S = { items: [], mi: [] }, tab = "home", fl = "open", MI = { cat: "job", q: "" }, R = null;
        try { const x = localStorage.getItem("los"); if (x) S = Object.assign(S, JSON.parse(x)) } catch (e) { }
        const save = () => { try { localStorage.setItem("los", JSON.stringify(S)) } catch (e) { } };
        const $ = i => document.getElementById(i);
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        const lnk = s => esc(s).replace(/https?:\/\/[^\s]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
        const ld = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
        const bar = (p, c) => `<div class="bar" style="--c:${c}"><i style="width:${p}%"></i></div>`;
        const wc = s => s.trim().split(/\s+/).filter(Boolean).length, fil = s => (s.match(/\b(um+|uh+|like|you know|actually|basically)\b/gi) || []).length;
        const msg = t => { $("ms").textContent = t; clearTimeout(window.m0); window.m0 = setTimeout(() => $("ms").textContent = "", 3500) };
        const PC = { 1: "#d6336c", 2: "#f08c00", 3: "#2f9e44" };
        function say(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = .92; speechSynthesis.speak(u) } catch (e) { } }
        function listen(btn, onText, onEnd) {
            const C = window.SpeechRecognition || window.webkitSpeechRecognition; if (!C) { msg("Voice input needs Chrome or Edge."); return }
            R = new C(); R.lang = $("lg").value; R.continuous = true; R.interimResults = true; btn.classList.add("f"); msg("Listening… tap again to stop.");
            R.onresult = e => { let f = "", m = ""; for (let i = 0; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) f += t + " "; else m += t } onText((f + m).trim()) };
            R.onend = () => { R = null; btn.classList.remove("f"); msg("Stopped."); onEnd && onEnd() }; R.onerror = () => msg("Microphone error or permission denied."); R.start()
        }
        function put(m, t, d, p, n) {
            t = (t || "").trim(); if (!t) return; const x = t.toLowerCase(); if (!d) { if (/\btomorrow\b/.test(x)) d = ld(new Date(Date.now() + 864e5)); else if (/\btoday\b/.test(x)) d = ld() }
            t = t.replace(/\b(today|tomorrow)\b/gi, "").replace(/\s+/g, " ").trim() || t; S.items.push({ id: Date.now() + Math.random().toString(36).slice(2, 6), m, t, d: d || "", p: +p || 2, n: n || "", x: 0 }); save(); draw()
        }
        const add = () => put(tab, $("ti").value, $("dt").value, $("pr").value, $("nt").value);
        const qadd = () => put($("qm").value, $("qt").value);
        function mic(id, btn) { if (R) { R.stop(); return } listen($(btn), x => { $(id).value = x; $(id).dispatchEvent(new Event("input")) }) }
        function tg(id) { const i = S.items.find(x => x.id == id); i.x = i.x ? 0 : 1; i.dn = i.x ? ld() : ""; save(); draw() }
        function rm(id) { UN = S.items.find(x => x.id == id); S.items = S.items.filter(x => x.id != id); save(); draw(); msg("Deleted. Tap here to undo.") }
        function pre() { PRE[tab].forEach(t => { if (!S.items.some(i => i.m == tab && i.t == t)) S.items.push({ id: Date.now() + Math.random().toString(36).slice(2, 6), m: tab, t, d: "", p: 2, n: "", x: 0 }) }); save(); draw() }
        const go = k => { tab = k; draw() };
        function item(i) { if (ED == i.id) return `<div class="row" style="flex-wrap:wrap"><input id="et" value="${esc(i.t)}" style="flex:1;min-width:150px"><input type="date" id="edt" value="${i.d}"><input id="enn" value="${esc(i.n || "")}" placeholder="Note"><button class="f" onclick="es('${i.id}')">Save</button><button onclick="ED=0;draw()">Cancel</button></div>`; const od = !i.x && i.d && i.d < ld(); return `<div class="row ${i.x ? "d" : ""}"><input type="checkbox" ${i.x ? "checked" : ""} onchange="tg('${i.id}')"><label><b style="color:${PC[i.p]}">●</b> <span style="cursor:text" title="Tap to edit" onclick="ed('${i.id}')">${esc(i.t)}</span><br><small>${i.d ? (od ? "⚠️ overdue " : "📅 ") + i.d + " " : ""}${lnk(i.n || "")}</small></label><button onclick="rm('${i.id}')">✕</button></div>` }
        function mod(id) {
            const m = M.find(x => x[0] == id), L = S.items.filter(i => i.m == id), d = L.filter(i => i.x).length;
            const sh = L.filter(i => fl == "all" || (fl == "open" ? !i.x : i.x)).sort((a, b) => (a.x - b.x) || ((a.d || "9") > (b.d || "9") ? 1 : (a.d || "9") < (b.d || "9") ? -1 : 0) || (a.p - b.p));
            return `<div class="c" style="--c:${m[2]}"><h2>${m[1]} <small>${d}/${L.length}</small></h2>${bar(L.length ? d / L.length * 100 : 0, m[2])}
<div class="add"><input id="ti" placeholder="${m[3]}"><button id="mb" onclick="mic('ti','mb')">🎤</button></div>
<div class="add"><input type="date" id="dt"><select id="pr"><option value="2">Normal</option><option value="1">High</option><option value="3">Low</option></select><input id="nt" placeholder="Note or link (optional)"><button class="f" onclick="add()">Add</button></div>
<div class="add"><input placeholder="🔍 Search this list" oninput="sf(this.value)"></div><div class="add">${["open", "done", "all"].map(f => `<button class="${fl == f ? "on" : ""}" onclick="fl='${f}';draw()">${f}</button>`).join("")}${PRE[id].length ? `<button onclick="pre()">⭐ Starter list</button>` : ""}</div>
${sh.map(item).join("") || "<p><small>Nothing here yet. Type, speak 🎤, or add the starter list.</small></p>"}</div>` + (id == "career" ? mock() : "")
        }
        const hist = () => S.mi.slice(0, 5).map(h => `<div class="row"><label><small>${h.d}</small> ${esc(h.q)}<br><small>${h.w} words · ${h.p} WPM · ${h.f} fillers</small></label></div>`).join("") || "<small>No attempts yet.</small>";
        function mock() {
            return `<div class="c" style="--c:#d6336c"><h2>🎤 Mock interview (voice)</h2><div class="add"><button class="${MI.cat == "job" ? "on" : ""}" onclick="MI.cat='job';draw()">Job</button><button class="${MI.cat == "abroad" ? "on" : ""}" onclick="MI.cat='abroad';draw()">Admission / Visa</button><button onclick="nq()">🔊 Ask me a question</button></div>
<div class="big" id="mq">${esc(MI.q) || "Press “Ask me a question”."}</div><button id="ab" onclick="ans()">⏺ Answer</button>
<div class="st" style="margin-top:8px"><div><b id="mt">0s</b>Time</div><div><b id="mw">0</b>Words</div><div><b id="mp">0</b>WPM</div><div><b id="mf">0</b>Fillers</div></div>
<p id="mx" style="min-height:50px"></p><div class="hint">STAR: Situation → Task → Action → Result. Aim for 45–90 seconds and about 100–130 WPM. Speech tools often skip ‘um’, so filler counts are approximate.</div><b>Recent answers</b><div id="hs">${hist()}</div></div>`
        }
        function nq() { const q = QB[MI.cat]; MI.q = q[Math.floor(Math.random() * q.length)]; $("mq").textContent = MI.q; say(MI.q) }
        function ans() {
            if (R) { R.stop(); return } if (!MI.q) { msg("Ask a question first."); return } const t0 = Date.now(); let tx = "";
            const up = () => { const s = Math.max(1, Math.round((Date.now() - t0) / 1e3)); $("mt").textContent = s + "s"; $("mw").textContent = wc(tx); $("mp").textContent = s > 4 ? Math.round(wc(tx) / s * 60) : 0; $("mf").textContent = fil(tx) }, iv = setInterval(up, 500);

            const oldName = S.wcats[index], newName = $("wcat" + index).value.trim();
            if (!newName) { msg("A category name cannot be empty."); return }
            if (S.wcats.some((c, i) => i != index && c.toLowerCase() == newName.toLowerCase())) { msg("That category already exists."); return }
            S.wcats[index] = newName; S.wl.forEach(w => { if (w.c == oldName) w.c = newName }); save(); draw(); msg("Category renamed.");
        }

        function walletCategoryDelete(index) {
            const name = S.wcats[index];
            if (!name || name == "Other" || !confirm(`Delete “${name}”? Its transactions will move to Other.`)) return;
            S.wcats = S.wcats.filter((c, i) => i != index); S.wl.forEach(w => { if (w.c == name) w.c = "Other" }); save(); draw(); msg("Category deleted.");
        }

        function walletAccounts() {
            const editing = WACC_EDIT ? S.wa.find(a => a.id == WACC_EDIT) || {} : {};
            return `<div class="c" style="--c:#1c7ed6"><h2>🏦 ${WACC_EDIT ? "Edit account" : "Add an account"}</h2><p><small>Track a bank account, mobile wallet or cash balance. Use only the last four digits; no full account number is needed.</small></p><div class="wallet-form-grid"><input id="waccName" value="${esc(editing.n || "")}" placeholder="Account name e.g. Salary"><input id="waccBank" value="${esc(editing.bank || "")}" placeholder="Bank / provider"><select id="waccType">${["Bank", "Mobile wallet", "Cash", "Savings", "Other"].map(k => `<option ${k == (editing.k || "Bank") ? "selected" : ""}>${k}</option>`).join("")}</select><input id="waccLast4" value="${esc(editing.last4 || "")}" maxlength="4" inputmode="numeric" placeholder="Last 4 digits"><input id="waccOpening" type="number" step="0.01" value="${editing.opening ?? ""}" placeholder="Opening balance ৳"></div><div class="wallet-actions"><button class="f" onclick="walletAccountSave()">${WACC_EDIT ? "Save changes" : "Add account"}</button>${WACC_EDIT ? `<button onclick="walletAccountCancel()">Cancel</button>` : ""}</div></div><div class="c"><h2>Your accounts</h2>${S.wa.map(a => `<div class="row" style="flex-wrap:wrap"><label style="min-width:170px"><b>${esc(a.n)}</b><br><small>${esc(a.bank || a.k || "Account")}${a.last4 ? ` · •••• ${esc(a.last4)}` : ""}${a.id == "cash" ? " · default" : ""}</small></label><b>৳${walletAccountBalance(a).toLocaleString()}</b><button onclick="walletAccountEdit('${a.id}')">Edit</button>${a.id == "cash" ? "" : `<button onclick="walletAccountDelete('${a.id}')">Delete</button>`}</div>`).join("")}</div>`;
        }

        function walletAccountSave() {
            const name = $("waccName").value.trim(), last4 = $("waccLast4").value.trim(), opening = Number($("waccOpening").value || 0);
            if (!name) { msg("Enter an account name."); return }
            if (last4 && !/^\d{4}$/.test(last4)) { msg("Enter the last four digits or leave them blank."); return }
            if (!Number.isFinite(opening)) { msg("Enter a valid opening balance."); return }
            const record = { id: WACC_EDIT || Date.now() + "", n: name, bank: $("waccBank").value.trim(), k: $("waccType").value, last4, opening };
            if (WACC_EDIT) { const old = S.wa.find(a => a.id == WACC_EDIT); if (old) Object.assign(old, record); }
            else S.wa.push(record);
            WACC_EDIT = ""; save(); draw(); msg("Account saved.");
        }

        function walletAccountEdit(id) { WACC_EDIT = id; draw(); setTimeout(() => $("waccName")?.focus(), 0) }
        function walletAccountCancel() { WACC_EDIT = ""; draw() }
        function walletAccountDelete(id) {
            if (id == "cash" || !confirm("Delete this account? Its transactions will stay under Cash wallet.")) return;
            S.wl.forEach(w => { if (w.accountId == id) w.accountId = "cash" }); S.cards.forEach(c => { if (c.accountId == id) c.accountId = "" }); S.wa = S.wa.filter(a => a.id != id); WACC_EDIT = ""; save(); draw(); msg("Account deleted.");
        }

        function walletCardImageMarkup(image) {
            const safe = walletSafeImage(image);
            return safe ? `<img src="${esc(safe)}" alt="Card image">` : "";
        }

        function walletCards() {
            const editing = WCARD_EDIT ? S.cards.find(c => c.id == WCARD_EDIT) || {} : {};
            if (!WCARD_EDIT && !WCARD_IMAGE) WCARD_IMAGE = "";
            const preview = WCARD_IMAGE ? `<img src="${esc(walletSafeImage(WCARD_IMAGE))}" alt="Card image preview">` : "<small>No image selected.</small>";
            return `<div class="c" style="--c:#7048e8"><h2>💳 ${WCARD_EDIT ? "Edit card" : "Add a card"}</h2><p><small>Upload an optional card image. Crop out the full card number and CVV before uploading. The image is compressed and stored in this browser.</small></p><div class="wallet-form-grid"><input id="wcardName" value="${esc(editing.n || "")}" placeholder="Card name e.g. Daily debit"><select id="wcardType">${["Debit", "Credit", "Prepaid"].map(k => `<option ${k == (editing.k || "Debit") ? "selected" : ""}>${k}</option>`).join("")}</select><input id="wcardNetwork" value="${esc(editing.network || "")}" placeholder="Network e.g. Visa"><input id="wcardLast4" value="${esc(editing.last4 || "")}" maxlength="4" inputmode="numeric" placeholder="Last 4 digits"><select id="wcardAccount"><option value="">No linked account</option>${walletSelectAccounts(editing.accountId || "")}</select><label>Card image<input id="wcardImageFile" type="file" accept="image/*" onchange="walletCardImage(this)"></label></div><div class="wallet-preview" id="wcardPreview">${preview}</div><div class="wallet-actions"><button class="f" onclick="walletCardSave()">${WCARD_EDIT ? "Save changes" : "Add card"}</button><button onclick="walletCardImageRemove()">Clear image</button>${WCARD_EDIT ? `<button onclick="walletCardCancel()">Cancel</button>` : ""}</div></div><div class="wallet-card-grid">${S.cards.map(c => `<div class="payment-card">${walletCardImageMarkup(c.image)}<div class="payment-meta"><b>${esc(c.n)} · ${esc(c.k || "Card")}</b><small>${esc(c.network || "")} ${c.last4 ? ` · •••• ${esc(c.last4)}` : ""} · ${esc(walletCardAccountName(c.accountId))}</small></div><div class="card-actions"><button onclick="walletCardEdit('${c.id}')">Edit</button><button onclick="walletCardDelete('${c.id}')">Delete</button></div></div>`).join("") || `<div class="c wallet-empty">No cards yet. Add a card above to connect it to transactions.</div>`}</div>`;
        }

        function walletCardImage(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            if (!file.type.startsWith("image/")) { msg("Choose an image file."); input.value = ""; return }
            if (file.size > 8 * 1024 * 1024) { msg("Choose an image under 8 MB."); input.value = ""; return }
            const reader = new FileReader();
            reader.onload = () => {
                const image = new Image();
                image.onload = () => {
                    const scale = Math.min(1, 1200 / Math.max(image.width, image.height)), canvas = document.createElement("canvas");
                    canvas.width = Math.max(1, Math.round(image.width * scale)); canvas.height = Math.max(1, Math.round(image.height * scale));
                    canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
                    WCARD_IMAGE = canvas.toDataURL("image/jpeg", .8); WCARD_IMAGE_REMOVED = false;
                    const preview = $("wcardPreview"); if (preview) preview.innerHTML = walletCardImageMarkup(WCARD_IMAGE);
                };
                image.onerror = () => msg("This image could not be opened."); image.src = reader.result;
            };
            reader.onerror = () => msg("Could not read that image."); reader.readAsDataURL(file);
        }

        function walletCardImageRemove() { WCARD_IMAGE = ""; WCARD_IMAGE_REMOVED = true; const preview = $("wcardPreview"); if (preview) preview.innerHTML = "<small>No image selected.</small>"; draw() }
        function walletCardSave() {
            const name = $("wcardName").value.trim(), last4 = $("wcardLast4").value.trim();
            if (!name) { msg("Enter a card name."); return }
            if (last4 && !/^\d{4}$/.test(last4)) { msg("Enter the last four digits or leave them blank."); return }
            const old = WCARD_EDIT ? S.cards.find(c => c.id == WCARD_EDIT) : null;
            const image = WCARD_IMAGE_REMOVED ? "" : walletSafeImage(WCARD_IMAGE) || (old && old.image) || "";
            const record = { id: WCARD_EDIT || Date.now() + "", n: name, k: $("wcardType").value, network: $("wcardNetwork").value.trim(), last4, accountId: $("wcardAccount").value || "", image };
            if (old) Object.assign(old, record); else S.cards.push(record);
            WCARD_EDIT = ""; WCARD_IMAGE = ""; WCARD_IMAGE_REMOVED = false; save(); draw(); msg("Card saved.");
        }

        function walletCardEdit(id) { const card = S.cards.find(c => c.id == id); if (!card) return; WCARD_EDIT = id; WCARD_IMAGE = card.image || ""; WCARD_IMAGE_REMOVED = false; draw(); setTimeout(() => $("wcardName")?.focus(), 0) }
        function walletCardCancel() { WCARD_EDIT = ""; WCARD_IMAGE = ""; WCARD_IMAGE_REMOVED = false; draw() }
        function walletCardDelete(id) {
            if (!confirm("Delete this card? Saved transactions will remain, with no card attached.")) return;
            S.wl.forEach(w => { if (w.cardId == id) w.cardId = "" }); S.cards = S.cards.filter(c => c.id != id); WCARD_EDIT = ""; WCARD_IMAGE = ""; WCARD_IMAGE_REMOVED = false; save(); draw(); msg("Card deleted.");
        }
        const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
        function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(); o.connect(a.destination); o.frequency.value = 880; o.start(); setTimeout(() => o.stop(), 600) } catch (e) { } }
        function focus() { const o = S.items.filter(i => !i.x); return `<div class="c" style="--c:#d6336c;text-align:center"><h2>⏱ Focus timer</h2><div class="big" id="fd" style="font-size:56px">${fmt(FT.left)}</div><div class="add" style="justify-content:center">${[25, 50, 5].map(m => `<button onclick="fset(${m})" class="${FT.len == m ? "on" : ""}">${m} min</button>`).join("")}</div><div class="add" style="justify-content:center"><button class="f" onclick="fgo()">${FT.run ? "⏸ Pause" : "▶ Start"}</button><button onclick="fset(FT.len)">↺ Reset</button></div><select>${"<option>Focus on… (optional)</option>" + o.map(i => `<option>${esc(i.t)}</option>`).join("")}</select><p>Sessions today: <b>${(S.fs || {})[ld()] || 0}</b> 🍅</p></div><div class="hint">One block, no phone. Take a 5-minute break after each. Finishing a 25 or 50 minute block counts as one session. Keep this tab open while it runs.</div>` }
        function fset(m) { clearInterval(FT.iv); FT = { left: m * 60, run: 0, iv: null, len: m }; draw() }
        function fgo() { if (FT.run) { clearInterval(FT.iv); FT.run = 0 } else { FT.run = 1; const end = Date.now() + FT.left * 1e3; FT.iv = setInterval(() => { FT.left = Math.max(0, Math.round((end - Date.now()) / 1e3)); const e = $("fd"); if (e) e.textContent = fmt(FT.left); document.title = fmt(FT.left) + " · Focus"; if (!FT.left) { clearInterval(FT.iv); FT.run = 0; document.title = "Saikat’s Life OS"; if (FT.len >= 25) { S.fs = S.fs || {}; S.fs[ld()] = (S.fs[ld()] || 0) + 1; save() } beep(); msg("🍅 Time’s up! Take a break."); if (tab == "focus") draw() } }, 500) } draw() }
        function review() {
            const D = [0, 1, 2, 3, 4, 5, 6].map(dk), d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); const wk = ld(d); S.rv = S.rv || {}; const r = S.rv[wk] || {};
            const tk = S.items.filter(i => i.x && D.includes(i.dn)).length, hb = (S.hb || []).reduce((a, h) => a + D.filter(x => h.log[x]).length, 0), fs = D.reduce((a, x) => a + ((S.fs || {})[x] || 0), 0), sp = (S.wl || []).filter(w => w.t == "out" && D.includes(w.d)).reduce((a, w) => a + w.a, 0), mi = S.mi.filter(h => D.includes(h.d)).length;
            const f = (k, l, p) => `<h2 style="margin-top:12px">${l}</h2><textarea id="r${k}" placeholder="${p}" oninput="rvs('${wk}','${k}',this.value)">${esc(r[k] || "")}</textarea><button id="rb${k}" onclick="mic('r${k}','rb${k}')">🎤 Speak</button>`;
            return `<div class="c" style="--c:#7048e8"><h2>📊 Last 7 days</h2><div class="st"><div><b>${tk}</b>Tasks done</div><div><b>${hb}</b>Habit check-ins</div><div><b>${fs}</b>Focus 🍅</div><div><b>${mi}</b>Mock answers</div><div><b>৳${sp}</b>Spent</div></div></div><div class="c" style="--c:#2f9e44"><h2>📝 Weekly reflection</h2>${f("w", "🏆 Wins this week", "What went well?")}${f("l", "📚 Lessons", "What did I learn?")}${f("n", "🎯 Next week’s focus", "Top 3 priorities")}</div>`
        }
        function rvs(w, k, v) { S.rv[w] = S.rv[w] || {}; S.rv[w][k] = v; save() }
        function draw() { $("nav").innerHTML = [["home", "🏠 Home"], ["habits", "🔥 Habits"], ["apps", "📨 Applications"], ["wallet", "💳 Wallet"], ["focus", "⏱ Focus"], ["review", "📊 Review"], ...M.map(m => [m[0], m[1]])].map(([k, n]) => `<button class="${tab == k ? "on" : ""}" onclick="go('${k}')"><span>${n.split(" ")[0]}</span>${n.split(" ").slice(1).join(" ")}</button>`).join(""); $("v").innerHTML = tab == "home" ? home() : tab == "habits" ? habits() : tab == "apps" ? apps() : tab == "wallet" ? wallet() : tab == "focus" ? focus() : tab == "review" ? review() : mod(tab) }
        draw();
    </script>
</body>

</html>
